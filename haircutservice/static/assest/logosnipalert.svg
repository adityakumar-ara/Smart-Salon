<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <!-- Notification Red Gradient -->
    <linearGradient id="alertColor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4757; stop-opacity:1" /> 
      <stop offset="100%" style="stop-color:#ff6b81; stop-opacity:1" /> 
    </linearGradient>
  </defs>

  <!-- SnipAlert Icon (Scissors + Sound Waves) -->
  <g transform="translate(10, 25)">
    <!-- Scissor Handles -->
    <circle cx="20" cy="15" r="8" stroke="#212529" stroke-width="4" fill="none"/>
    <circle cx="20" cy="45" r="8" stroke="#212529" stroke-width="4" fill="none"/>
    
    <!-- Scissor Blades -->
    <path d="M 27 15 L 65 45" stroke="#212529" stroke-width="4" stroke-linecap="round"/>
    <path d="M 27 45 L 65 15" stroke="#212529" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Scissor Pivot/Screw -->
    <circle cx="41" cy="30" r="2.5" fill="#212529"/>

    <!-- Alert Sound Waves (Red) -->
    <path d="M 75 15 Q 85 30 75 45" stroke="url(#alertColor)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M 85 8 Q 100 30 85 52" stroke="url(#alertColor)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Brand Name Text -->
  <text x="130" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#212529" letter-spacing="-1.5">
    Snip<tspan fill="url(#alertColor)">Alert</tspan>
  </text>
  
  <!-- Tagline Text -->
  <text x="135" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#6c757d" letter-spacing="3">
    AUDIO QUEUE MANAGEMENT
  </text>
</svg>
