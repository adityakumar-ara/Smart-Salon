{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f766e">
    <title>Session Expired | SnipAlert</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/csrf-error.css' %}">
</head>
<body class="csrf-page">
    <main class="container d-flex min-vh-100 align-items-center justify-content-center py-4">
        <section class="csrf-card text-center" aria-labelledby="csrf-heading">
            <div class="brand-mark">
                <img src="{% static 'assest/logosnipalert.svg' %}" alt="SnipAlert" class="brand-logo">
            </div>

            <div class="status-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 9v4"></path><path d="M12 17h.01"></path><path d="m10.3 2.86-8.08 14A2 2 0 0 0 3.95 20h16.1a2 2 0 0 0 1.73-3.14l-8.08-14a2 2 0 0 0-3.4 0Z"></path>
                </svg>
            </div>

            <p class="eyebrow mb-2">SECURITY CHECK</p>
            <h1 id="csrf-heading">Session Expired</h1>
            <p class="message mb-2">Your session has expired. Please refresh to continue.</p>
            <p class="message message-hindi mb-4" lang="hi">आपका सत्र समाप्त हो गया है। जारी रखने के लिए कृपया पेज रिफ्रेश करें।</p>

            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                <button type="button" class="btn btn-refresh" id="refresh-page">Refresh Page</button>
                <a href="/" class="btn btn-home">Go to Home</a>
            </div>
        </section>
    </main>

    <script src="{% static 'js/csrf-error.js' %}"></script>
</body>
</html>
