{% extends 'main.html' %}

{% block content %}
  <section class="removal-page container">
    <div class="removal-card">
      <div class="removal-icon"><i class="bi bi-exclamation-triangle"></i></div>
      <h1>Remove {{ salon.salon_name }}?</h1>
      <p>This will hide your salon, services, and listings from customers. Your data will not be permanently deleted.</p>

      {% if otp_sent %}
        <form method="post" class="removal-form">
          {% csrf_token %}
          <input type="hidden" name="action" value="confirm_remove" />
          <label for="removal-otp">Enter the OTP sent to {{ user.email }}</label>
          <input id="removal-otp" name="otp" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="6-digit OTP" required />
          <button type="submit" class="btn btn-danger">Confirm &amp; Remove Salon</button>
        </form>
      {% else %}
        <form method="post" class="removal-form">
          {% csrf_token %}
          <input type="hidden" name="action" value="send_otp" />
          <label class="removal-confirmation"><input type="checkbox" name="confirm_remove" value="yes" required /> I understand that my salon will no longer be visible to customers.</label>
          <button type="submit" class="btn btn-danger">Yes, send OTP</button>
          <a href="{% url 'salon_detail' %}" class="btn btn-outline-secondary">Keep My Salon</a>
        </form>
      {% endif %}
    </div>
  </section>
{% endblock %}
